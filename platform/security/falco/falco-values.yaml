driver:
  kind: ebpf

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

falco:
  json_output: true
  log_level: info

falcosidekick:
  enabled: true
  config:
    loki:
      hostport: http://loki.monitoring.svc.cluster.local:3100
      minimumpriority: warning
      customlabels: "cluster=homelab"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  webui:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

# Suppress rules disabled pending rule name verification against falco-rules:3.
# Re-enable once correct rule names are confirmed from a running Falco instance.
